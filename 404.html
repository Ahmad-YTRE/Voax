<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <meta name="robots" content="noindex">
  <title>404 — Page not found | Voax</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#090b10;color:#f1f3f7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,420px);text-align:center}
    .brand{display:inline-block;margin-bottom:48px;color:#f1f3f7;font-size:22px;font-weight:800;letter-spacing:-.7px;text-decoration:none}
    .code{margin:0;color:#7d8797;font-size:14px;font-weight:700;letter-spacing:.12em}
    h1{margin:12px 0 10px;font-size:30px;line-height:1.2;letter-spacing:-.8px}
    p{margin:0;color:#9aa3b2;font-size:14px;line-height:1.6}
    .actions{display:flex;justify-content:center;margin-top:26px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:8px;background:#5eead4;color:#071311;font-size:13px;font-weight:700;text-decoration:none;transition:background .15s}
    .button:hover{background:#83f2e1}
    .home{display:inline-block;margin-top:18px;color:#aeb7c5;font-size:12px;text-decoration:none}
    .home:hover{color:#fff}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Voax home">Voax</a>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved.</p>
    <div class="actions">
      <a class="button" href="/app">Back to Voax</a>
    </div>
    <a class="home" href="/">Go to homepage</a>
  </main>
</body>
</html>
