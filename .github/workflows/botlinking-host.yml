name: BotLinking checks
on:
  push:
    branches: [main, feature/voax-linking]
    paths:
      - "BotLinking/**"
      - ".github/workflows/botlinking-host.yml"
  pull_request:
    branches: [main]
    paths:
      - "BotLinking/**"
      - ".github/workflows/botlinking-host.yml"
permissions:
  contents: read
jobs:
  bot-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BotLinking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check bot-hosting.net entry point
        run: node --check index.js
      - name: Type-check canonical worker
        run: npm run typecheck
      - name: Run bot tests
        run: npm test
      - name: Verify host startup metadata
        run: node -e "const p=require('./package.json'); if(p.main!=='index.js'||p.scripts.start!=='node index.js') process.exit(1)"
